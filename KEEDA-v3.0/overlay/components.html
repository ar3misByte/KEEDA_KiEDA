<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Components - KiCad Live</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="components">

<div class="brand">
  <span class="logo">&#9672;</span>
  <div><h1>KiCad Live</h1><p>Project manager</p></div>
</div>

<div class="topbar">
  <div class="project"><span>Project</span><b id="project-name">-</b></div>
  <div class="right">
    <span class="pill" id="online-count">0 online</span>
    <span class="pill"><span class="dot" id="conn-dot"></span><span id="conn-text">Connecting...</span></span>
  </div>
</div>

<nav></nav>

<main>
<h2 class="page-title">Components</h2>
<p class="page-sub">Schematic and PCB joined by reference designator. Anything the two disagree on is
listed first.</p>

<div class="stats" id="xr-stats"></div>

<div class="filters">
  <select id="xr-filter">
    <option value="issues">Issues only</option>
    <option value="all">All components</option>
  </select>
  <div class="spacer"></div>
  <span class="pill" id="obj-count">0 components</span>
  <span class="pill" id="xr-source">PCB: -</span>
</div>

<div class="card">
  <table class="data">
    <thead><tr><th>Reference</th><th>Component</th><th>Schematic</th><th>PCB</th><th>Status</th></tr></thead>
    <tbody id="objects"></tbody>
  </table>
</div>

</main>

<div class="toasts"></div>
<script src="/static/app.js"></script>
</body>
</html>
